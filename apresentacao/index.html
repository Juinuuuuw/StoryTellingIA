<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>História Interativa - NAO</title>
    <!-- Use elegant fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(15, 15, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-glow: 0 0 10px rgba(255,255,255,0.3);
            --accent: #d4af37; /* Cinematic Gold */
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
        }

        /* ─── FULLSCREEN BACKGROUND & KEN BURNS ─── */
        #scene-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: #050505;
        }
        
        #scene-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            opacity: 0.85; /* slight dim for text readability */
        }

        /* Vignette Overlay for cinematic feel */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 110%);
            z-index: 2;
            pointer-events: none;
        }

        /* ─── STORY PANEL (GLASSMORPHISM) ─── */
        #story-panel {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px 40px;
            z-index: 10;
            display: none; /* hidden until story starts */
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Legenda ocultada manualmente (Shift+E) - !important pois o JS define display:block */
        #story-panel.legenda-oculta {
            display: none !important;
        }
        
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        
        .nao-badge {
            background: var(--accent);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        /* Selo exibido nas cenas que são marcos históricos */
        .marco-badge {
            display: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #2ecc71; }
            50% { opacity: 0.4; box-shadow: 0 0 2px #2ecc71; }
        }

        #story-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            line-height: 1.5;
            color: #f4f4f4;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* ─── LOADER ─── */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }
        
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── MODAL DECISÃO ─── */
        #interaction-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 50px;
            max-width: 900px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        #modal-question {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: var(--text-glow);
        }

        .decisao-aviso {
            font-size: 1.4rem;
            font-weight: 300;
            color: var(--accent);
            letter-spacing: 1px;
            animation: pulse-texto 2s ease-in-out infinite;
        }
        @keyframes pulse-texto {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        /* ─── TELA INTRO ─── */
        #intro-screen {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .intro-btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        .intro-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px var(--accent);
        }

        /* ─── QUIZ MODAL ─── */
        #quiz-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .quiz-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 50px;
            max-width: 900px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        #quiz-progress {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        #quiz-question {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: var(--text-glow);
        }

        #quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .quiz-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
        }

        .quiz-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.15);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .quiz-btn:disabled {
            cursor: default;
            opacity: 0.6;
        }

        /* ─── TELA FIM QUIZ ─── */
        #quiz-fim-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9998;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        #quiz-fim-screen .emoji {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        #quiz-fim-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 12px;
        }

        #quiz-fim-subtitulo {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
        }

        .quiz-fim-badge {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px 60px;
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: #fff;
        }

        /* ─── QUESTIONÁRIO LIKERT ─── */
        #likert-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #050510;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow: hidden;
        }

        .likert-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 50px 60px;
            max-width: 960px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) rgba(255,255,255,0.05);
        }
        .likert-box::-webkit-scrollbar { width: 6px; }
        .likert-box::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 3px; }
        .likert-box::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

        .likert-section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .likert-section-desc {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.45);
            margin-bottom: 36px;
            letter-spacing: 1px;
        }

        .likert-progress {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .likert-question-block {
            margin-bottom: 40px;
        }

        .likert-question-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #f4f4f4;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .likert-scale {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .likert-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            min-width: 80px;
        }
        .likert-label.right { text-align: right; }

        .likert-buttons {
            display: flex;
            gap: 10px;
            flex: 1;
            justify-content: center;
        }

        .likert-btn {
            width: 52px; height: 52px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.25);
            background: transparent;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .likert-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.1); }
        .likert-btn.selected { background: var(--accent); border-color: var(--accent); color: #000; transform: scale(1.1); }

        .likert-grid {
            width: 100%;
            overflow-x: auto;
        }
        .likert-grid table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Montserrat', sans-serif;
        }
        .likert-grid th {
            color: var(--accent);
            font-size: 0.9rem;
            padding: 10px 8px;
            text-align: center;
        }
        .likert-grid td {
            padding: 12px 8px;
            text-align: center;
            color: #f4f4f4;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            font-size: 0.95rem;
        }
        .likert-grid td:first-child { text-align: left; padding-left: 0; }
        .likert-grid .grid-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.25);
            background: transparent;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .likert-grid .grid-btn:hover { border-color: var(--accent); color: var(--accent); }
        .likert-grid .grid-btn.selected { background: var(--accent); border-color: var(--accent); color: #000; }

        .likert-next-btn {
            margin-top: 40px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 14px 50px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
            display: block;
            margin-left: auto;
        }
        .likert-next-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }
        .likert-next-btn:disabled { opacity: 0.35; cursor: default; }

        /* ─── TELA FINAL COMPLETA ─── */
        #fim-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }
        #fim-screen .emoji { font-size: 5rem; margin-bottom: 20px; animation: pop 0.6s ease; }
        #fim-titulo { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--accent); margin-bottom: 16px; }
        #fim-subtitulo { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; color: rgba(255,255,255,0.65); }
    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-family: 'Montserrat'; font-size: 1.2rem; letter-spacing: 4px;">PINTANDO CENA...</div>
    </div>

    <!-- Scene Images -->
    <div id="scene-container">
        <img id="scene-image" src="" alt="Cena">
    </div>
    
    <!-- Cinematic Vignette Overlay -->
    <div class="vignette"></div>

    <!-- Story Panel -->
    <div id="story-panel">
        <div class="panel-header">
            <div class="nao-badge">NAO</div>
            <div class="marco-badge" id="marco-badge"></div>
            <div class="status-dot" id="status-dot"></div>
        </div>
        <div id="story-text">Aguardando início da história...</div>
    </div>

    <!-- Decision Modal -->
    <div id="interaction-modal">
        <div class="modal-box">
            <h2 id="modal-question"></h2>
            <div id="modal-options"></div>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div id="quiz-modal">
        <div class="quiz-box">
            <div id="quiz-progress">Pergunta 1 de 3</div>
            <h2 id="quiz-question">Carregando pergunta...</h2>
            <div id="quiz-options"></div>
        </div>
    </div>

    <!-- Tela de Fim do Quiz Cognitivo -->
    <div id="quiz-fim-screen">
        <div class="emoji"><i data-lucide="party-popper" style="width:1.2em; height:1.2em; display:inline-block; vertical-align:-0.2em; margin-right:4px;"></i></div>
        <div id="quiz-fim-titulo">Parabéns!</div>
        <div id="quiz-fim-subtitulo">Você completou a jornada histórica!</div>
        <div class="quiz-fim-badge" id="quiz-fim-badge">0 / 0</div>
    </div>

    <!-- Questionário Likert Estático -->
    <div id="likert-screen">
        <div class="likert-box">
            <div class="likert-progress" id="likert-progress"></div>
            <div class="likert-section-title" id="likert-section-title"></div>
            <div class="likert-section-desc" id="likert-section-desc"></div>
            <div id="likert-questions-container"></div>
            <button class="likert-next-btn" id="likert-next-btn" onclick="likertNext()">CONTINUAR →</button>
        </div>
    </div>

    <!-- Tela Final da Experiência -->
    <div id="fim-screen">
        <div class="emoji"><i data-lucide="star" style="width:1.2em; height:1.2em; display:inline-block; vertical-align:-0.2em; margin-right:4px;"></i></div>
        <div id="fim-titulo">Obrigado pela participação!</div>
        <div id="fim-subtitulo">Sua jornada histórica está completa. Os dados foram registrados.</div>
    </div>

    <script>
        const SERVER_IP = "192.168.16.191";
        const API_URL = `http://${SERVER_IP}:5000`;

        let lastSessionId = null;
        let lastPreId = null; // o pre_id agora é informado em decisao.html
        let lastHistoryText = null;
        let currentSequenceId = 0;
        let isModalLocallyOpen = false;
        let typeWriterTimeout = null;

        // Shift+E: alterna (esconde/mostra) a legenda da história
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey && e.code === 'KeyE') {
                const tag = (e.target && e.target.tagName || '').toLowerCase();
                if (tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)) return;
                e.preventDefault();
                document.getElementById('story-panel').classList.toggle('legenda-oculta');
            }
        });

        // ─── Sincronização de quadros (a rede é instável) ─────────────────
        // O servidor guarda estado absoluto — cena X, quadro N — então reenviar é seguro.
        // O quadro só avança quando o servidor o libera: fim da fala do NAO, botão do
        // dashboard, botão do painel de decisão ou tempo-limite.
        let cenaAtualId = null;      // cena_id da cena em exibição
        let quadroExibido = -1;      // quadro que está na tela agora
        let quadroLiberado = -1;     // maior quadro desta cena já liberado pelo servidor
        const TEMPO_MINIMO_QUADRO_MS = 3000;   // cada imagem fica pelo menos isso na tela

        // POST com reenvio até o servidor confirmar (desiste se a cena mudar)
        async function postarComConfirmacao(caminho, corpo, cenaId) {
            for (let tentativa = 0; tentativa < 120; tentativa++) {
                if (cenaId !== cenaAtualId) return;
                try {
                    const r = await fetch(`${API_URL}${caminho}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(corpo),
                        cache: 'no-store'
                    });
                    if (r.ok) return;
                } catch (e) {}
                await new Promise(res => setTimeout(res, 1000));
            }
        }


        function typeWriterEffect(text, element) {
            if (typeWriterTimeout) clearTimeout(typeWriterTimeout);
            element.innerHTML = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    typeWriterTimeout = setTimeout(type, 30);
                }
            }
            type();
        }

        /**
         * splitByCharLength — divide o texto da cena em N trechos equilibrados, um por quadro.
         * Cada trecho é o que aparece na tela e o que o NAO fala enquanto o quadro está visível,
         * então trechos de tamanhos parecidos = quadros com duração parecida.
         *
         *  1. Quebra em frases (. ! ? …) mantendo a aspa de fechamento na frase certa
         *     e sem cortar abreviações/iniciais ("J.C.R.", "Dr.").
         *  2. Agrupa as frases em N trechos contíguos com o menor desvio de tamanho
         *     possível (programação dinâmica).
         *  3. Se faltam frases, ou se um trecho ficou bem maior que outro, quebra a frase
         *     mais longa numa pausa natural (vírgula, ponto e vírgula, travessão) perto do
         *     meio — fora de falas entre aspas. Só corta entre palavras se não houver pausa
         *     e ainda faltarem pedaços.
         * Nenhum trecho fica vazio (se o texto tiver ao menos N palavras) e o texto é preservado.
         */
        function splitByCharLength(text, numChunks) {
            text = (text || '').replace(/\s+/g, ' ').trim();
            if (numChunks <= 1) return [text];
            if (!text) return Array(numChunks).fill('');

            const ASPAS = `"'“”‘’`;
            const RAZAO_ACEITAVEL = 1.4;   // maior trecho / menor trecho

            // ── 1. Frases ──
            const units = [];
            const fimFrase = /[.!?…]+["'”’)\]]*(?= )/g;
            let inicio = 0, m;
            while ((m = fimFrase.exec(text)) !== null) {
                const fim = m.index + m[0].length;
                const frase = text.slice(inicio, fim);
                // "J.C.R. Licklider", "Dr. Silva" — não é fim de frase
                if (m[0] === '.' && /(?:^|[ .])(?:[A-Z]|Dr|Dra|Sr|Sra|Srta|Prof|Profa|St|Mr|Mrs|Ms|Jr)\.$/.test(frase)) continue;
                units.push(frase.trim());
                inicio = fim;
            }
            if (text.slice(inicio).trim()) units.push(text.slice(inicio).trim());

            // ── Melhor ponto de corte dentro de um pedaço (ou -1) ──
            function pontoDeCorte(s, permitirPalavras) {
                // marca o que está dentro de uma fala entre aspas
                const dentro = new Array(s.length).fill(false);
                let aberta = false;
                for (let i = 0; i < s.length; i++) {
                    const c = s[i];
                    if (ASPAS.includes(c)) {
                        const antes = i === 0 ? ' ' : s[i - 1];
                        const depois = i === s.length - 1 ? ' ' : s[i + 1];
                        if (/[\s(—–]/.test(antes) && !/\s/.test(depois)) aberta = true;
                        else if (!/\s/.test(antes) && /[\s.,;:!?…)—–]/.test(depois)) { dentro[i] = true; aberta = false; continue; }
                    }
                    dentro[i] = aberta;
                }
                const meio = s.length / 2;
                const minLado = Math.min(25, Math.floor(s.length / 4));
                let melhor = -1, melhorNota = Infinity;
                for (let i = 0; i < s.length; i++) {
                    if (s[i] !== ' ') continue;
                    if (i < minLado || s.length - i < minLado) continue;
                    // pausa natural: espaço logo após , ; : — – (com aspa de fechamento opcional)
                    let j = i - 1;
                    while (j > 0 && ASPAS.includes(s[j])) j--;
                    const pausa = /[,;:—–]/.test(s[j]);
                    if (!pausa && !permitirPalavras) continue;
                    let nota = Math.abs(i - meio);
                    if (!pausa) nota += s.length;              // palavra solta só em último caso
                    if (dentro[i]) nota += s.length * 0.5;     // evita cortar uma fala no meio
                    if (nota < melhorNota) { melhorNota = nota; melhor = i; }
                }
                return melhor;
            }

            function quebrar(idx, permitirPalavras) {
                const corte = pontoDeCorte(units[idx], permitirPalavras);
                if (corte < 0) return false;
                const s = units[idx];
                units.splice(idx, 1, s.slice(0, corte).trim(), s.slice(corte + 1).trim());
                return true;
            }

            // ── 2. Agrupamento ótimo em N trechos contíguos ──
            function agrupar() {
                const n = units.length;
                const acum = [0];
                units.forEach(u => acum.push(acum[acum.length - 1] + u.length + 1));
                const tam = (a, b) => acum[b] - acum[a] - 1;
                const alvo = tam(0, n) / numChunks;
                const custo = Array.from({ length: numChunks + 1 }, () => new Array(n + 1).fill(Infinity));
                const de = Array.from({ length: numChunks + 1 }, () => new Array(n + 1).fill(0));
                custo[0][0] = 0;
                for (let k = 1; k <= numChunks; k++) {
                    for (let i = k; i <= n - (numChunks - k); i++) {
                        for (let j = k - 1; j < i; j++) {
                            const c = custo[k - 1][j] + (tam(j, i) - alvo) ** 2;
                            if (c < custo[k][i]) { custo[k][i] = c; de[k][i] = j; }
                        }
                    }
                }
                const grupos = [];
                for (let k = numChunks, i = n; k > 0; k--) {
                    const j = de[k][i];
                    grupos.unshift({ de: j, ate: i, texto: units.slice(j, i).join(' ') });
                    i = j;
                }
                return grupos;
            }

            // garante ao menos N pedaços
            while (units.length < numChunks) {
                let maior = 0;
                units.forEach((u, i) => { if (u.length > units[maior].length) maior = i; });
                if (!quebrar(maior, true)) break;
            }
            if (units.length < numChunks) {
                // texto curto demais para N trechos (menos de N palavras)
                while (units.length < numChunks) units.push('');
                return units;
            }

            // ── 3. Refina enquanto houver desequilíbrio ──
            const razao = gs => {
                const t = gs.map(g => g.texto.length);
                return Math.max(...t) / Math.max(1, Math.min(...t));
            };
            let grupos = agrupar();
            const tentadas = new Set();
            for (let iter = 0; iter < 8 && razao(grupos) > RAZAO_ACEITAVEL; iter++) {
                // quebra a frase mais longa ainda não tentada, priorizando o maior trecho
                const maiorGrupo = grupos.reduce((a, g) => g.texto.length > a.texto.length ? g : a);
                let alvoIdx = -1;
                for (let i = maiorGrupo.de; i < maiorGrupo.ate; i++) {
                    if (!tentadas.has(units[i]) && (alvoIdx < 0 || units[i].length > units[alvoIdx].length)) alvoIdx = i;
                }
                if (alvoIdx < 0) {
                    units.forEach((u, i) => {
                        if (!tentadas.has(u) && (alvoIdx < 0 || u.length > units[alvoIdx].length)) alvoIdx = i;
                    });
                }
                if (alvoIdx < 0) break;

                const antes = units.slice();
                tentadas.add(units[alvoIdx]);
                if (!quebrar(alvoIdx, false)) continue;
                const novos = agrupar();
                if (razao(novos) < razao(grupos) - 0.05) {
                    grupos = novos;
                } else {
                    units.splice(0, units.length, ...antes);   // a quebra não ajudou: desfaz
                }
            }
            return grupos.map(g => g.texto);
        }

        async function waitForImage(filename) {
            let currentFilename = filename;
            let attempts = 0;
            while(attempts < 300) {
                try {
                    const res = await fetch(`${API_URL}/check_image/${currentFilename}`, { cache: 'no-store' });
                    const data = await res.json();
                    if (data.ready) return currentFilename;
                } catch(e) {}
                
                attempts++;
                if (attempts === 20 && currentFilename.endsWith('.gif')) {
                    currentFilename = currentFilename.replace('.gif', '.png');
                }
                await new Promise(r => setTimeout(r, 1000));
            }
            return null;
        }

        async function startImageSequence(images, data, textChunks) {
            currentSequenceId++;
            const seqId = currentSequenceId;
            const cenaId = cenaAtualId;

            // Avisa o servidor (e o NAO) qual quadro está na tela — com reenvio
            const publicarQuadro = (idx) => {
                quadroExibido = idx;
                postarComConfirmacao('/publicar_quadro', { cena_id: cenaId, quadro_idx: idx }, cenaId);
            };

            const imgEl = document.getElementById('scene-image');
            const loader = document.getElementById('loader');
            const storyTextEl = document.getElementById('story-text');
            
            imgEl.style.display = "block";

            const playFrame = async (idx) => {
                const filename = images[idx];

                // Para os quadros seguintes (2, 3 e 4), exibe o texto imediatamente
                // enquanto a imagem termina de ser gerada em background
                if (idx > 0) {
                    if (textChunks && textChunks[idx]) {
                        typeWriterEffect(textChunks[idx], storyTextEl);
                    }
                    // Notifica o servidor para o NAO já ir falando
                    publicarQuadro(idx);
                }

                const finalFilename = await waitForImage(filename);
                if (seqId !== currentSequenceId) return false;
                
                if (finalFilename) {
                    const url = `${API_URL}/images/${finalFilename}`;
                    const img = new Image();
                    await new Promise(res => { img.onload = res; img.onerror = res; img.src = url; });
                    
                    if (idx === 0) {
                        loader.style.display = 'none';
                        // Para o primeiro quadro, exibe o texto apenas DEPOIS da imagem pronta
                        if (textChunks && textChunks[idx]) {
                            typeWriterEffect(textChunks[idx], storyTextEl);
                        }
                        publicarQuadro(idx);
                    }

                    imgEl.src = url;
                    gsap.fromTo(imgEl,
                        { scale: 1.05, x: 0, y: 0, opacity: 0.2 },
                        { scale: 1.15, x: 10, y: -10, opacity: 1, duration: 10, ease: "sine.inOut" }
                    );
                    return true;
                }
                return false;
            };

            // ── Espera o servidor liberar o quadro (NAO terminou, botões ou tempo-limite) ──
            // e a imagem ficar o tempo mínimo na tela (a fala pode acabar antes da imagem ficar pronta)
            const esperarLiberacao = async (idx, exibidoEm) => {
                while (seqId === currentSequenceId) {
                    if (quadroLiberado >= idx && Date.now() - exibidoEm >= TEMPO_MINIMO_QUADRO_MS) return;
                    await new Promise(r => setTimeout(r, 300));
                }
            };

            if (images.length === 0) { triggerDecisionModal(data); return; }

            let algumaImagemExibida = false;
            for (let i = 0; i < images.length; i++) {
                if (seqId !== currentSequenceId) return;
                const success = await playFrame(i);

                if (success) {
                    algumaImagemExibida = true;
                    await esperarLiberacao(i, Date.now());
                    if (i < images.length - 1) {
                        // pequena pausa de transição (fôlego)
                        await new Promise(r => setTimeout(r, 400));
                    }
                }

                if (i === images.length - 1) {
                    // Último frame: mostrar modal de decisão ou encerrar
                    if (!algumaImagemExibida) {
                        // Nenhuma imagem carregou (daemon falhou) — mostra ao menos o texto
                        loader.style.display = 'none';
                        typeWriterEffect(data.historia_original || data.historia || '', storyTextEl);
                    }
                    if (seqId === currentSequenceId) {
                        triggerDecisionModal(data);
                        if (data.tem_opcoes === false || !data.opcoes || data.opcoes.length === 0) {
                            // Fim da história: avisa o backend para encerrar a sessão
                            fetch(`${API_URL}/finalizar_sessao`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ session_id: lastSessionId })
                            }).catch(() => {});
                        }
                    }
                }
            }
        }

        function hideModal() {
            document.getElementById('interaction-modal').style.display = 'none';

        async function checkActiveSession() {
            try {
                // Cada consulta informa o quadro na tela: se um aviso se perdeu na rede, o servidor se corrige
                const sync = (cenaAtualId !== null && quadroExibido >= 0) ? `?cena_id=${cenaAtualId}&quadro=${quadroExibido}` : '';
                const r = await fetch(`${API_URL}/visualizador/cena_atual${sync}`, { cache: 'no-store' });
                const data = await r.json();

                if (data.status === "aguardando" || data.status === "pensando") {
                    document.getElementById('loader').style.display = 'flex';
                    if (!isModalLocallyOpen && data.status === "aguardando") {
                        document.getElementById('loader').querySelector('div:last-child').innerText =
                            lastSessionId ? "AGUARDANDO O NAO..." : "AGUARDANDO INÍCIO NA TELA DE DECISÃO...";
                    } else if (data.status === "pensando") {
                        hideModal(); // escolha feita na página de decisão
                        document.getElementById('loader').querySelector('div:last-child').innerText = "CRIANDO PRÓXIMA CENA...";
                    }
                    return;
                }

                if (data.status === "modal") {
                    document.getElementById('loader').style.display = 'none';
                    const modalData = data.dados || data;
                    if (!isModalLocallyOpen) {
                        showModal({
                            pergunta: modalData.pergunta,
                            opcoes: modalData.opcoes
                        });
                    }
                    return;
                }

                // 🔹 Quiz: gerando 🔹
                if (data.status === "quiz_gerando") {
                    document.getElementById('loader').style.display = 'flex';
                    document.getElementById('loader').querySelector('div:last-child').innerText = "PREPARANDO PERGUNTAS...";
                    hideModal();
                    return;
                }

                // 🔹 Quiz: pergunta atual (Obsoleto, agora é no pós-questionário) 🔹
                if (data.status === "quiz") {
                    return;
                }

                // ── História Finalizada ──
                if (data.status === "historia_fim" || data.status === "quiz_fim") {
                    if (!window.historiaFinalizada) {
                        window.historiaFinalizada = true;
                        
                        // Oculta loader e qualquer modal
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('quiz-modal').style.display = 'none';
                        hideModal();
                        
                        // Mostra a tela de Fim de Sessão
                        const fimScreen = document.getElementById('quiz-fim-screen');
                        fimScreen.style.display = 'flex';
                        gsap.fromTo(fimScreen, { opacity: 0 }, { opacity: 1, duration: 1, ease: "power2.out" });
                        
                        document.getElementById('quiz-fim-badge').innerHTML = `✨`;
                        document.getElementById('quiz-fim-titulo').innerText = "Obrigado por ouvir a história!";
                        document.getElementById('quiz-fim-subtitulo').innerText = "A história terminou! Chame o pesquisador responsável para seguir para a próxima etapa.";
                    }
                    return;
                }

                // Status ATIVO (ignora qualquer outro status, ex.: comando_avulso)
                if (data.status !== "ativo") return;
                const sceneData = data.dados || data;

                // Nova história iniciada na tela de decisão depois de uma que terminou
                if (window.historiaFinalizada && data.session_id !== lastSessionId) {
                    window.historiaFinalizada = false;
                    document.getElementById('quiz-fim-screen').style.display = 'none';
                }
                document.getElementById('story-panel').style.display = 'block';
                
                // Liberação do quadro vinda do servidor (só da cena em exibição)
                if (data.cena_id === cenaAtualId && typeof data.quadro_liberado === 'number') {
                    quadroLiberado = Math.max(quadroLiberado, data.quadro_liberado);
                }

                const textoHistoria = sceneData.historia_original || sceneData.historia || "";
                
                if (data.cena_id !== cenaAtualId || data.session_id !== lastSessionId || textoHistoria !== lastHistoryText) {
                    lastSessionId = data.session_id;
                    lastHistoryText = textoHistoria;
                    cenaAtualId = data.cena_id;
                    quadroExibido = -1;
                    quadroLiberado = typeof data.quadro_liberado === 'number' ? data.quadro_liberado : -1;

                    hideModal();
                    document.getElementById('loader').style.display = 'flex'; // mantem loader até imagem 1 carregar
                    atualizarMarcoBadge(sceneData.marco_historico);

                    const storyTextEl = document.getElementById('story-text');
                    
                    const hasImages = Array.isArray(sceneData.imagens_arquivos) && sceneData.imagens_arquivos.length > 0;
                    if (hasImages) {
                        const numChunks = sceneData.imagens_arquivos.length;
                        const textChunks = splitByCharLength(textoHistoria, numChunks);
                        
                        // Registra os text_chunks para o NAO sincronizar (com reenvio até confirmar).
                        postarComConfirmacao('/registrar_chunks', { cena_id: cenaAtualId, text_chunks: textChunks }, cenaAtualId);

                        startImageSequence(sceneData.imagens_arquivos, sceneData, textChunks);
                    } else {
                        typeWriterEffect(textoHistoria, storyTextEl);
                        document.getElementById('loader').style.display = 'none';
                        triggerDecisionModal(sceneData);
                    }
                }
            } catch (err) {
                console.log("Erro ao sincronizar:", err);
            }
        }

                        linhas: ["Morto / Com vida", "Parado / Enérgico", "Artificial / Realista", "Estático / Interativo", "Apático / Participativo"]
                    },
                    {
                        subtitulo: "Simpatia",
                        linhas: ["Não gosto / Gosto", "Hostil / Amigável", "Antipático / Gentil", "Desagradável / Agradável", "Horrível / Simpático"]
                    },
                    {
                        subtitulo: "Inteligência Percebida",
                        linhas: ["Incompetente / Competente", "Ignorante / Sabedor", "Irresponsável / Responsável", "Pouco inteligente / Inteligente", "Insensato / Sensato"]
                    },
                    {
                        subtitulo: "Segurança Percebida",
                        linhas: ["Ansioso / Descontraído", "Calmo / Agitado", "Sereno / Surpreendido"]
                    }
                ]
            },
            {
                titulo: "Expectativa e Experiência",
                desc: "",
                tipo: "escala",
                perguntas: [
                    { texto: "Considerando suas expectativas antes da sessão, como você avalia a experiência realizada?", labelEsq: "Muito abaixo do que eu esperava", labelDir: "Muito acima do que eu esperava" },
                ]
            }
        ];

        let likertSecaoAtual = 0;
        const likertRespostas = {};

        function iniciarLikert() {
            likertSecaoAtual = 0;
            document.getElementById('likert-screen').style.display = 'flex';
            gsap.fromTo('#likert-screen', { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" });
            renderizarSecaoLikert();
        }

        function renderizarSecaoLikert() {
            const totalSecoes = LIKERT_SECOES.length;
            const secao = LIKERT_SECOES[likertSecaoAtual];
            const secaoNum = likertSecaoAtual + 1;

            document.getElementById('likert-progress').innerText = `Seção ${secaoNum} de ${totalSecoes}`;
            document.getElementById('likert-section-title').innerText = secao.titulo;
            document.getElementById('likert-section-desc').innerText = secao.desc || '';

            const container = document.getElementById('likert-questions-container');
            container.innerHTML = '';

            if (secao.tipo === 'escala') {
                secao.perguntas.forEach((p, pIdx) => {
                    const chave = `s${likertSecaoAtual}_q${pIdx}`;
                    const block = document.createElement('div');
                    block.className = 'likert-question-block';
                    block.innerHTML = `
                        <div class="likert-question-text">${p.texto}</div>
                        <div class="likert-scale">
                            <span class="likert-label">${p.labelEsq}</span>
                            <div class="likert-buttons" id="btns_${chave}">
                                ${[1,2,3,4,5].map(v => `<button class="likert-btn" onclick="selecionarLikert('${chave}',${v},this)">${v}</button>`).join('')}
                            </div>
                            <span class="likert-label right">${p.labelDir}</span>
                        </div>`;
                    container.appendChild(block);
                });
            } else if (secao.tipo === 'grid') {
                secao.grupos.forEach((grupo, gIdx) => {
                    const header = document.createElement('div');
                    header.style.cssText = 'font-family:"Playfair Display",serif;font-size:1.2rem;color:var(--accent);margin:24px 0 10px;';
                    header.innerText = grupo.subtitulo;
                    container.appendChild(header);

                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'likert-grid';
                    let tableHtml = `<table><thead><tr><th style="text-align:left">Par</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody>`;
                    grupo.linhas.forEach((linha, lIdx) => {
                        const chave = `s${likertSecaoAtual}_g${gIdx}_l${lIdx}`;
                        tableHtml += `<tr><td>${linha}</td>${[1,2,3,4,5].map(v => `<td><button class="grid-btn" id="grid_${chave}_${v}" onclick="selecionarGrid('${chave}',${v})">${v}</button></td>`).join('')}</tr>`;
                    });
                    tableHtml += `</tbody></table>`;
                    gridDiv.innerHTML = tableHtml;
                    container.appendChild(gridDiv);
                });
            }

            atualizarBotaoLikert();
            gsap.fromTo('.likert-box', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" });
        }

        function selecionarLikert(chave, valor, btn) {
            likertRespostas[chave] = valor;
            const container = btn.closest('.likert-buttons');
            container.querySelectorAll('.likert-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            atualizarBotaoLikert();
        }

        function selecionarGrid(chave, valor) {
            likertRespostas[chave] = valor;
            [1,2,3,4,5].forEach(v => {
                const b = document.getElementById(`grid_${chave}_${v}`);
                if (b) b.classList.toggle('selected', v === valor);
            });
            atualizarBotaoLikert();
        }

        function secaoRespondida() {
            const secao = LIKERT_SECOES[likertSecaoAtual];
            if (secao.tipo === 'escala') {
                return secao.perguntas.every((_, pIdx) => likertRespostas[`s${likertSecaoAtual}_q${pIdx}`] !== undefined);
            } else if (secao.tipo === 'grid') {
                return secao.grupos.every((grupo, gIdx) =>
                    grupo.linhas.every((_, lIdx) => likertRespostas[`s${likertSecaoAtual}_g${gIdx}_l${lIdx}`] !== undefined)
                );
            }
            return true;
        }

        function atualizarBotaoLikert() {
            document.getElementById('likert-next-btn').disabled = !secaoRespondida();
        }

        function likertNext() {
            likertSecaoAtual++;
            if (likertSecaoAtual < LIKERT_SECOES.length) {
                renderizarSecaoLikert();
                document.querySelector('.likert-box').scrollTop = 0;
            } else {
                // Todas as seções respondidas → tela final
                document.getElementById('likert-screen').style.display = 'none';
                const fim = document.getElementById('fim-screen');
                fim.style.display = 'flex';
                gsap.fromTo(fim, { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" });
                console.log("📊 Respostas Likert:", JSON.stringify(likertRespostas));
                
                fetch(`${API_URL}/salvar_likert`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: lastSessionId,
                        respostas: likertRespostas,
                        secoes: LIKERT_SECOES
                    })
                }).catch(e => console.error("Erro ao salvar Likert:", e));

                // ─── Atualiza status do participante para historia_concluida ───
                if (lastPreId) {
                    fetch(`${API_URL}/atualizar_status_pre`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            pre_id: lastPreId,
                            status: 'historia_concluida',
                            session_id: lastSessionId
                        })
                    }).catch(() => {});
                }
            }
        }


        // O cadastro (código, nome, jornada, personagem) acontece em decisao.html.
        // A apresentação só acompanha o servidor e começa quando a história é iniciada lá.
        function pollStatus() {
            setInterval(checkActiveSession, 500);
        }
        document.addEventListener('DOMContentLoaded', () => {
            pollStatus();
            checkActiveSession();
        });

    </script>

  <script src="lucide.js"></script>
  <script>
    if (window.lucide) {
      lucide.createIcons();
      const observer = new MutationObserver(() => {
        observer.disconnect();
        lucide.createIcons();
        observer.observe(document.body, { childList: true, subtree: true });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    }
  </script>
</body>
</html>
