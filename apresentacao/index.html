<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>História Interativa - NAO</title>
    <!-- Use elegant fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(15, 15, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-glow: 0 0 10px rgba(255,255,255,0.3);
            --accent: #d4af37; /* Cinematic Gold */
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
        }

        /* ─── FULLSCREEN BACKGROUND & KEN BURNS ─── */
        #scene-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: #050505;
        }
        
        #scene-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            opacity: 0.85; /* slight dim for text readability */
        }

        /* Vignette Overlay for cinematic feel */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 110%);
            z-index: 2;
            pointer-events: none;
        }

        /* ─── STORY PANEL (GLASSMORPHISM) ─── */
        #story-panel {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px 40px;
            z-index: 10;
            display: none; /* hidden until story starts */
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        
        .nao-badge {
            background: var(--accent);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #2ecc71; }
            50% { opacity: 0.4; box-shadow: 0 0 2px #2ecc71; }
        }

        #story-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            line-height: 1.5;
            color: #f4f4f4;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* ─── LOADER ─── */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }
        
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── MODAL DECISÃO ─── */
        #interaction-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 50px;
            max-width: 900px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        #modal-question {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: var(--text-glow);
        }

        .choice-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
        }

        .choice-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* ─── TELA INTRO ─── */
        #intro-screen {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .intro-btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        .intro-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px var(--accent);
        }

        /* ─── QUIZ MODAL ─── */
        #quiz-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(12px);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .quiz-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 50px 60px;
            max-width: 950px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }

        #quiz-progress {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        #quiz-question {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            color: #fff;
            margin-bottom: 40px;
            line-height: 1.35;
            text-shadow: var(--text-glow);
        }

        #quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .quiz-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 22px 18px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            text-align: left;
            line-height: 1.3;
        }

        .quiz-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.12);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .quiz-btn.correta {
            background: rgba(46, 204, 113, 0.25) !important;
            border-color: #2ecc71 !important;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.4) !important;
        }

        .quiz-btn.errada {
            background: rgba(231, 76, 60, 0.25) !important;
            border-color: #e74c3c !important;
        }

        .quiz-btn.revelada {
            background: rgba(46, 204, 113, 0.15) !important;
            border-color: #2ecc71 !important;
        }

        /* ─── TELA FIM QUIZ ─── */
        #quiz-fim-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9998;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        #quiz-fim-screen .emoji {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        #quiz-fim-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 12px;
        }

        #quiz-fim-subtitulo {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
        }

        .quiz-fim-badge {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px 60px;
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Intro -->
    <div id="intro-screen">
        <button class="intro-btn" onclick="startPresentation()">INICIAR EXPERIÊNCIA</button>
    </div>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-family: 'Montserrat'; font-size: 1.2rem; letter-spacing: 4px;">PINTANDO CENA...</div>
    </div>

    <!-- Scene Images -->
    <div id="scene-container">
        <img id="scene-image" src="" alt="Cena">
    </div>
    
    <!-- Cinematic Vignette Overlay -->
    <div class="vignette"></div>

    <!-- Story Panel -->
    <div id="story-panel">
        <div class="panel-header">
            <div class="nao-badge">NAO</div>
            <div class="status-dot" id="status-dot"></div>
        </div>
        <div id="story-text">Aguardando início da história...</div>
    </div>

    <!-- Decision Modal -->
    <div id="interaction-modal">
        <div class="modal-box">
            <h2 id="modal-question"></h2>
            <div id="modal-options" style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;"></div>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div id="quiz-modal">
        <div class="quiz-box">
            <div id="quiz-progress">Pergunta 1 de 3</div>
            <h2 id="quiz-question">Carregando pergunta...</h2>
            <div id="quiz-options"></div>
        </div>
    </div>

    <!-- Tela de Fim do Quiz -->
    <div id="quiz-fim-screen">
        <div class="emoji">🎉</div>
        <div id="quiz-fim-titulo">Parabéns!</div>
        <div id="quiz-fim-subtitulo">Você completou a jornada histórica!</div>
        <div class="quiz-fim-badge" id="quiz-fim-badge">0 / 0</div>
    </div>

    <script>
        const SERVER_IP = window.location.hostname || "192.168.16.69";
        const API_URL = `http://${SERVER_IP}:5000`;
        const ROBOT_URL = "http://localhost:8080";

        let lastSessionId = null;
        let lastHistoryText = null;
        let currentSequenceId = 0;
        let isModalLocallyOpen = false;
        let typeWriterTimeout = null;

        function typeWriterEffect(text, element) {
            if (typeWriterTimeout) clearTimeout(typeWriterTimeout);
            element.innerHTML = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    typeWriterTimeout = setTimeout(type, 30);
                }
            }
            type();
        }

        function startPresentation() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('story-panel').style.display = 'block';
            pollStatus();
        }

        async function loadImageWithRetry(url, retries = 30) {
            return new Promise((resolve) => {
                let attempts = 0;
                let currentUrl = url;
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => {
                    attempts++;
                    if (attempts >= retries) {
                        // If we failed to load a .gif, it might have fallen back to .png on the server
                        if (currentUrl.endsWith('.gif')) {
                            console.warn("GIF loading failed, attempting PNG fallback for: " + currentUrl);
                            currentUrl = currentUrl.replace('.gif', '.png');
                            attempts = 0; // reset attempts for the PNG fallback
                            setTimeout(() => { img.src = currentUrl; }, 1000);
                        } else {
                            resolve(false);
                        }
                    } else {
                        setTimeout(() => { img.src = currentUrl; }, 1000);
                    }
                };
                img.src = currentUrl;
            });
        }

        async function startImageSequence(images, data) {
            currentSequenceId++;
            const seqId = currentSequenceId;

            const imgEl = document.getElementById('scene-image');
            const loader = document.getElementById('loader');
            
            loader.style.display = 'none';
            imgEl.style.display = "block";

            const playFrame = async (idx) => {
                const url = `${API_URL}/images/${images[idx]}`;
                const ready = await loadImageWithRetry(url);
                if (seqId !== currentSequenceId) return false;
                if (ready) {
                    imgEl.src = url;
                    // Efeito Ken Burns Cinematico
                    gsap.fromTo(imgEl,
                        { scale: 1.05, x: 0, y: 0, opacity: 0.2 },
                        { scale: 1.15, x: 10, y: -10, opacity: 1, duration: 10, ease: "sine.inOut" }
                    );
                    return true;
                }
                return false;
            };

            if (images.length === 0) { triggerDecisionModal(data); return; }

            for (let i = 0; i < images.length; i++) {
                if (seqId !== currentSequenceId) return;
                await playFrame(i);
                
                // Transição de fade inout para a próxima
                if (i < images.length - 1) {
                    await new Promise(r => setTimeout(r, 8000));
                } else {
                    await new Promise(r => setTimeout(r, 8000));
                    if (seqId === currentSequenceId) triggerDecisionModal(data);
                }
            }
        }

        function triggerDecisionModal(data) {
            if (data.opcoes && data.opcoes.length > 0) {
                showModal({
                    pergunta: "QUAL É A SUA DECISÃO?",
                    opcoes: data.opcoes
                });
            }
        }

        function showModal(data) {
            isModalLocallyOpen = true;
            const modalEl = document.getElementById('interaction-modal');
            const modalBox = modalEl.querySelector('.modal-box');
            
            modalEl.style.display = 'flex';
            document.getElementById('modal-question').innerText = data.pergunta;
            
            gsap.fromTo(modalBox, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" });
            
            const optsContainer = document.getElementById('modal-options');
            optsContainer.innerHTML = '';
            optsContainer.style.pointerEvents = 'auto'; // RESET POINTER EVENTS HERE
            
            if (data.opcoes) {
                data.opcoes.forEach((opt, idx) => {
                    const btn = document.createElement('div');
                    btn.className = 'choice-btn';
                    btn.innerText = opt;
                    btn.onclick = async () => {
                        optsContainer.style.pointerEvents = 'none';
                        btn.style.background = 'var(--accent)';
                        btn.style.color = '#000';
                        
                        try {
                            await fetch(`${API_URL}/enviar_escolha`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ escolha_idx: idx, escolha_texto: opt })
                            });
                            hideModal();
                        } catch(e) {
                            console.error(e);
                        }
                    };
                    optsContainer.appendChild(btn);
                });
            }
        }

        function hideModal() {
            document.getElementById('interaction-modal').style.display = 'none';
            isModalLocallyOpen = false;
        }

        async function checkActiveSession() {
            try {
                const req = await fetch(`${API_URL}/visualizador/cena_atual`);
                const data = await req.json();

                if (data.status === "aguardando" || data.status === "pensando") {
                    document.getElementById('loader').style.display = 'flex';
                    if (!isModalLocallyOpen && data.status === "aguardando") {
                        document.getElementById('loader').querySelector('div:last-child').innerText = "AGUARDANDO O NAO...";
                    } else if (data.status === "pensando") {
                        document.getElementById('loader').querySelector('div:last-child').innerText = "CRIANDO PRÓXIMA CENA...";
                    }
                    return;
                }

                if (data.status === "modal") {
                    document.getElementById('loader').style.display = 'none';
                    const modalData = data.dados || data;
                    if (!isModalLocallyOpen || document.getElementById('modal-question').innerText !== modalData.pergunta) {
                        showModal({
                            pergunta: modalData.pergunta,
                            opcoes: modalData.opcoes
                        });
                    }
                    return;
                }

                // ── Quiz: gerando ──
                if (data.status === "quiz_gerando") {
                    document.getElementById('loader').style.display = 'flex';
                    document.getElementById('loader').querySelector('div:last-child').innerText = "PREPARANDO PERGUNTAS...";
                    hideModal();
                    return;
                }

                // ── Quiz: pergunta atual ──
                if (data.status === "quiz") {
                    document.getElementById('loader').style.display = 'none';
                    const quizData = data.dados;
                    const perguntaId = quizData ? quizData.pergunta_id : null;
                    const dadosPergunta = quizData ? quizData.dados : null;
                    const numAtual = quizData ? quizData.num_atual : 1;
                    const total = quizData ? quizData.total : 3;

                    if (dadosPergunta && document.getElementById('quiz-question').innerText !== dadosPergunta.pergunta) {
                        showQuizModal(data.session_id, perguntaId, dadosPergunta, numAtual, total);
                    }
                    return;
                }

                // ── Quiz: finalizado ──
                if (data.status === "quiz_fim") {
                    const resultado = data.dados ? data.dados.resultado : null;
                    if (document.getElementById('quiz-fim-screen').style.display !== 'flex') {
                        showQuizFim(resultado);
                    }
                    return;
                }

                // Status ATIVO
                const sceneData = data.dados || data;
                const textoHistoria = sceneData.historia_original || sceneData.historia || "";
                
                if (data.session_id !== lastSessionId || textoHistoria !== lastHistoryText) {
                    lastSessionId = data.session_id;
                    lastHistoryText = textoHistoria;

                    hideModal();
                    document.getElementById('loader').style.display = 'flex'; // mantem loader até imagem 1 carregar
                    
                    const storyTextEl = document.getElementById('story-text');
                    typeWriterEffect(textoHistoria, storyTextEl);

                    const hasImages = Array.isArray(sceneData.imagens_arquivos) && sceneData.imagens_arquivos.length > 0;
                    if (hasImages) {
                        startImageSequence(sceneData.imagens_arquivos, sceneData);
                    } else {
                        document.getElementById('loader').style.display = 'none';
                        triggerDecisionModal(sceneData);
                    }
                }
            } catch (err) {
                console.log("Erro ao sincronizar:", err);
            }
        }

        // ─── QUIZ FUNCTIONS ───────────────────────────────────────────────

        let quizRespondidaAtual = false;

        function showQuizModal(sessionId, perguntaId, dadosPergunta, numAtual, total) {
            quizRespondidaAtual = false;

            document.getElementById('quiz-progress').innerText = `Pergunta ${numAtual} de ${total}`;
            document.getElementById('quiz-question').innerText = dadosPergunta.pergunta;

            const optsContainer = document.getElementById('quiz-options');
            optsContainer.innerHTML = '';

            const quizModal = document.getElementById('quiz-modal');
            quizModal.style.display = 'flex';

            gsap.fromTo(quizModal.querySelector('.quiz-box'),
                { scale: 0.92, opacity: 0 },
                { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }
            );

            dadosPergunta.opcoes.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = opt;
                btn.onclick = () => respondirQuiz(sessionId, perguntaId, idx, dadosPergunta.resposta_correta, btn, optsContainer);
                optsContainer.appendChild(btn);
            });
        }

        async function respondirQuiz(sessionId, perguntaId, respostaIdx, respostaCorretaIdx, btnClicado, optsContainer) {
            if (quizRespondidaAtual) return;
            quizRespondidaAtual = true;

            // Bloqueia todos os botões
            optsContainer.querySelectorAll('.quiz-btn').forEach(b => b.disabled = true);

            // Feedback visual imediato
            if (respostaIdx === respostaCorretaIdx) {
                btnClicado.classList.add('correta');
            } else {
                btnClicado.classList.add('errada');
                // Revela a resposta correta
                const btns = optsContainer.querySelectorAll('.quiz-btn');
                if (btns[respostaCorretaIdx]) btns[respostaCorretaIdx].classList.add('revelada');
            }

            // Envia resposta ao servidor
            try {
                await fetch(`${API_URL}/responder_quiz`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        pergunta_id: perguntaId,
                        resposta_idx: respostaIdx
                    })
                });
            } catch(e) {
                console.error("Erro ao enviar resposta do quiz:", e);
            }

            // Aguarda 2s mostrando o feedback antes de fechar o modal (o polling atualizará a próxima)
            await new Promise(r => setTimeout(r, 2000));
            document.getElementById('quiz-question').innerText = "..."; // reset para o polling detectar mudança
        }

        function showQuizFim(resultado) {
            document.getElementById('quiz-modal').style.display = 'none';
            document.getElementById('loader').style.display = 'none';

            const fimScreen = document.getElementById('quiz-fim-screen');
            fimScreen.style.display = 'flex';

            gsap.fromTo(fimScreen, { opacity: 0 }, { opacity: 1, duration: 1, ease: "power2.out" });

            if (resultado) {
                const acertos = resultado.acertos || 0;
                const total = resultado.total_perguntas || 3;
                const nome = resultado.nome_aluno || "Explorador";
                const pct = resultado.percentual || 0;

                document.getElementById('quiz-fim-badge').innerText = `${acertos} / ${total}`;

                let titulo = "Parabéns!";
                let subtitulo = `${nome}, você completou a jornada histórica!`;

                if (pct === 100) {
                    titulo = "Perfeito! 🌟";
                    subtitulo = `${nome}, acertou tudo! Você é um verdadeiro explorador da história!`;
                } else if (pct >= 66) {
                    titulo = "Muito bem! 👏";
                    subtitulo = `${nome}, você conhece bem a história!`;
                } else if (pct >= 33) {
                    titulo = "Bom trabalho!";
                    subtitulo = `${nome}, continue explorando para aprender mais!`;
                } else {
                    titulo = "Continue tentando!";
                    subtitulo = `${nome}, cada jornada é uma nova oportunidade de aprender!`;
                }

                document.getElementById('quiz-fim-titulo').innerText = titulo;
                document.getElementById('quiz-fim-subtitulo').innerText = subtitulo;
            }
        }

        function pollStatus() {
            setInterval(checkActiveSession, 2000);
        }

    </script>
</body>
</html>
