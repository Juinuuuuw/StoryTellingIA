<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>História Interativa - NAO</title>
    <!-- Use elegant fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(15, 15, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-glow: 0 0 10px rgba(255,255,255,0.3);
            --accent: #d4af37; /* Cinematic Gold */
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
        }

        /* ─── FULLSCREEN BACKGROUND & KEN BURNS ─── */
        #scene-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: #050505;
        }
        
        #scene-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            opacity: 0.85; /* slight dim for text readability */
        }

        /* Vignette Overlay for cinematic feel */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 110%);
            z-index: 2;
            pointer-events: none;
        }

        /* ─── STORY PANEL (GLASSMORPHISM) ─── */
        #story-panel {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px 40px;
            z-index: 10;
            display: none; /* hidden until story starts */
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        
        .nao-badge {
            background: var(--accent);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #2ecc71; }
            50% { opacity: 0.4; box-shadow: 0 0 2px #2ecc71; }
        }

        #story-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            line-height: 1.5;
            color: #f4f4f4;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* ─── LOADER ─── */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }
        
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── MODAL DECISÃO ─── */
        #interaction-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 50px;
            max-width: 900px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        #modal-question {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: var(--text-glow);
        }

        .choice-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
        }

        .choice-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* ─── TELA INTRO ─── */
        #intro-screen {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .intro-btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        .intro-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px var(--accent);
        }

        /* ─── QUIZ MODAL ─── */
        #quiz-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .quiz-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 50px;
            max-width: 900px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        #quiz-progress {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        #quiz-question {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: var(--text-glow);
        }

        #quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .quiz-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
        }

        .quiz-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.15);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .quiz-btn:disabled {
            cursor: default;
            opacity: 0.6;
        }

        /* ─── TELA FIM QUIZ ─── */
        #quiz-fim-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9998;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        #quiz-fim-screen .emoji {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        #quiz-fim-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 12px;
        }

        #quiz-fim-subtitulo {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
        }

        .quiz-fim-badge {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px 60px;
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: #fff;
        }

        /* ─── QUESTIONÁRIO LIKERT ─── */
        #likert-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #050510;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow-y: auto;
        }

        .likert-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 50px 60px;
            max-width: 960px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .likert-section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .likert-section-desc {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.45);
            margin-bottom: 36px;
            letter-spacing: 1px;
        }

        .likert-progress {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .likert-question-block {
            margin-bottom: 40px;
        }

        .likert-question-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #f4f4f4;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .likert-scale {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .likert-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            min-width: 80px;
        }
        .likert-label.right { text-align: right; }

        .likert-buttons {
            display: flex;
            gap: 10px;
            flex: 1;
            justify-content: center;
        }

        .likert-btn {
            width: 52px; height: 52px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.25);
            background: transparent;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .likert-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.1); }
        .likert-btn.selected { background: var(--accent); border-color: var(--accent); color: #000; transform: scale(1.1); }

        .likert-grid {
            width: 100%;
            overflow-x: auto;
        }
        .likert-grid table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Montserrat', sans-serif;
        }
        .likert-grid th {
            color: var(--accent);
            font-size: 0.9rem;
            padding: 10px 8px;
            text-align: center;
        }
        .likert-grid td {
            padding: 12px 8px;
            text-align: center;
            color: #f4f4f4;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            font-size: 0.95rem;
        }
        .likert-grid td:first-child { text-align: left; padding-left: 0; }
        .likert-grid .grid-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.25);
            background: transparent;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .likert-grid .grid-btn:hover { border-color: var(--accent); color: var(--accent); }
        .likert-grid .grid-btn.selected { background: var(--accent); border-color: var(--accent); color: #000; }

        .likert-next-btn {
            margin-top: 40px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 14px 50px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
            display: block;
            margin-left: auto;
        }
        .likert-next-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }
        .likert-next-btn:disabled { opacity: 0.35; cursor: default; }

        /* ─── TELA FINAL COMPLETA ─── */
        #fim-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }
        #fim-screen .emoji { font-size: 5rem; margin-bottom: 20px; animation: pop 0.6s ease; }
        #fim-titulo { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--accent); margin-bottom: 16px; }
        #fim-subtitulo { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; color: rgba(255,255,255,0.65); }
    </style>
</head>
<body>

    <!-- Intro -->
    <div id="intro-screen">
        <button class="intro-btn" onclick="startPresentation()">INICIAR EXPERIÊNCIA</button>
    </div>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-family: 'Montserrat'; font-size: 1.2rem; letter-spacing: 4px;">PINTANDO CENA...</div>
    </div>

    <!-- Scene Images -->
    <div id="scene-container">
        <img id="scene-image" src="" alt="Cena">
    </div>
    
    <!-- Cinematic Vignette Overlay -->
    <div class="vignette"></div>

    <!-- Story Panel -->
    <div id="story-panel">
        <div class="panel-header">
            <div class="nao-badge">NAO</div>
            <div class="status-dot" id="status-dot"></div>
        </div>
        <div id="story-text">Aguardando início da história...</div>
    </div>

    <!-- Decision Modal -->
    <div id="interaction-modal">
        <div class="modal-box">
            <h2 id="modal-question"></h2>
            <div id="modal-options" style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;"></div>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div id="quiz-modal">
        <div class="quiz-box">
            <div id="quiz-progress">Pergunta 1 de 3</div>
            <h2 id="quiz-question">Carregando pergunta...</h2>
            <div id="quiz-options"></div>
        </div>
    </div>

    <!-- Tela de Fim do Quiz Cognitivo -->
    <div id="quiz-fim-screen">
        <div class="emoji">🎉</div>
        <div id="quiz-fim-titulo">Parabéns!</div>
        <div id="quiz-fim-subtitulo">Você completou a jornada histórica!</div>
        <div class="quiz-fim-badge" id="quiz-fim-badge">0 / 0</div>
    </div>

    <!-- Questionário Likert Estático -->
    <div id="likert-screen">
        <div class="likert-box">
            <div class="likert-progress" id="likert-progress"></div>
            <div class="likert-section-title" id="likert-section-title"></div>
            <div class="likert-section-desc" id="likert-section-desc"></div>
            <div id="likert-questions-container"></div>
            <button class="likert-next-btn" id="likert-next-btn" onclick="likertNext()">CONTINUAR →</button>
        </div>
    </div>

    <!-- Tela Final da Experiência -->
    <div id="fim-screen">
        <div class="emoji">⭐</div>
        <div id="fim-titulo">Obrigado pela participação!</div>
        <div id="fim-subtitulo">Sua jornada histórica está completa. Os dados foram registrados.</div>
    </div>

    <script>
        const SERVER_IP = window.location.hostname || "192.168.16.69";
        const API_URL = `http://${SERVER_IP}:5000`;
        const ROBOT_URL = "http://localhost:8080";

        let lastSessionId = null;
        let lastHistoryText = null;
        let currentSequenceId = 0;
        let isModalLocallyOpen = false;
        let typeWriterTimeout = null;

        function typeWriterEffect(text, element) {
            if (typeWriterTimeout) clearTimeout(typeWriterTimeout);
            element.innerHTML = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    typeWriterTimeout = setTimeout(type, 30);
                }
            }
            type();
        }

        function startPresentation() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('story-panel').style.display = 'block';
            pollStatus();
        }

        async function loadImageWithRetry(url, retries = 30) {
            return new Promise((resolve) => {
                let attempts = 0;
                let currentUrl = url;
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => {
                    attempts++;
                    if (attempts >= retries) {
                        // If we failed to load a .gif, it might have fallen back to .png on the server
                        if (currentUrl.endsWith('.gif')) {
                            console.warn("GIF loading failed, attempting PNG fallback for: " + currentUrl);
                            currentUrl = currentUrl.replace('.gif', '.png');
                            attempts = 0; // reset attempts for the PNG fallback
                            setTimeout(() => { img.src = currentUrl; }, 1000);
                        } else {
                            resolve(false);
                        }
                    } else {
                        setTimeout(() => { img.src = currentUrl; }, 1000);
                    }
                };
                img.src = currentUrl;
            });
        }

        async function startImageSequence(images, data, textChunks) {
            currentSequenceId++;
            const seqId = currentSequenceId;

            const imgEl = document.getElementById('scene-image');
            const loader = document.getElementById('loader');
            const storyTextEl = document.getElementById('story-text');
            
            loader.style.display = 'none';
            imgEl.style.display = "block";

            const playFrame = async (idx) => {
                const url = `${API_URL}/images/${images[idx]}`;
                const ready = await loadImageWithRetry(url);
                if (seqId !== currentSequenceId) return false;
                if (ready) {
                    imgEl.src = url;
                    if (textChunks && textChunks[idx]) {
                        typeWriterEffect(textChunks[idx], storyTextEl);
                    }
                    // Efeito Ken Burns Cinematico
                    gsap.fromTo(imgEl,
                        { scale: 1.05, x: 0, y: 0, opacity: 0.2 },
                        { scale: 1.15, x: 10, y: -10, opacity: 1, duration: 10, ease: "sine.inOut" }
                    );
                    return true;
                }
                return false;
            };

            if (images.length === 0) { triggerDecisionModal(data); return; }

            for (let i = 0; i < images.length; i++) {
                if (seqId !== currentSequenceId) return;
                await playFrame(i);
                
                // Transição de fade inout para a próxima
                if (i < images.length - 1) {
                    await new Promise(r => setTimeout(r, 8000));
                } else {
                    await new Promise(r => setTimeout(r, 8000));
                    if (seqId === currentSequenceId) triggerDecisionModal(data);
                }
            }
        }

        function triggerDecisionModal(data) {
            if (data.tem_opcoes !== false && data.opcoes && data.opcoes.length > 0) {
                showModal({
                    pergunta: "QUAL É A SUA DECISÃO?",
                    opcoes: data.opcoes
                });
            }
        }

        function showModal(data) {
            isModalLocallyOpen = true;
            const modalEl = document.getElementById('interaction-modal');
            const modalBox = modalEl.querySelector('.modal-box');
            
            modalEl.style.display = 'flex';
            document.getElementById('modal-question').innerText = data.pergunta;
            
            gsap.fromTo(modalBox, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" });
            
            const optsContainer = document.getElementById('modal-options');
            optsContainer.innerHTML = '';
            optsContainer.style.pointerEvents = 'auto'; // RESET POINTER EVENTS HERE
            
            if (data.opcoes) {
                data.opcoes.forEach((opt, idx) => {
                    const btn = document.createElement('div');
                    btn.className = 'choice-btn';
                    btn.innerText = opt;
                    btn.onclick = async () => {
                        optsContainer.style.pointerEvents = 'none';
                        btn.style.background = 'var(--accent)';
                        btn.style.color = '#000';
                        
                        try {
                            await fetch(`${API_URL}/enviar_escolha`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ escolha_idx: idx, escolha_texto: opt })
                            });
                            hideModal();
                        } catch(e) {
                            console.error(e);
                        }
                    };
                    optsContainer.appendChild(btn);
                });
            }
        }

        function hideModal() {
            document.getElementById('interaction-modal').style.display = 'none';
            isModalLocallyOpen = false;
        }

        async function checkActiveSession() {
            try {
                const req = await fetch(`${API_URL}/visualizador/cena_atual`);
                const data = await req.json();

                if (data.status === "aguardando" || data.status === "pensando") {
                    document.getElementById('loader').style.display = 'flex';
                    if (!isModalLocallyOpen && data.status === "aguardando") {
                        document.getElementById('loader').querySelector('div:last-child').innerText = "AGUARDANDO O NAO...";
                    } else if (data.status === "pensando") {
                        document.getElementById('loader').querySelector('div:last-child').innerText = "CRIANDO PRÓXIMA CENA...";
                    }
                    return;
                }

                if (data.status === "modal") {
                    document.getElementById('loader').style.display = 'none';
                    const modalData = data.dados || data;
                    if (!isModalLocallyOpen || document.getElementById('modal-question').innerText !== modalData.pergunta) {
                        showModal({
                            pergunta: modalData.pergunta,
                            opcoes: modalData.opcoes
                        });
                    }
                    return;
                }

                // ── Quiz: gerando ──
                if (data.status === "quiz_gerando") {
                    document.getElementById('loader').style.display = 'flex';
                    document.getElementById('loader').querySelector('div:last-child').innerText = "PREPARANDO PERGUNTAS...";
                    hideModal();
                    return;
                }

                // ── Quiz: pergunta atual ──
                if (data.status === "quiz") {
                    document.getElementById('loader').style.display = 'none';
                    const quizData = data.dados;
                    const perguntaId = quizData ? quizData.pergunta_id : null;
                    const dadosPergunta = quizData ? quizData.dados : null;
                    const numAtual = quizData ? quizData.num_atual : 1;
                    const total = quizData ? quizData.total : 3;

                    if (dadosPergunta && document.getElementById('quiz-question').innerText !== dadosPergunta.pergunta) {
                        showQuizModal(data.session_id, perguntaId, dadosPergunta, numAtual, total);
                    }
                    return;
                }

                // ── Quiz: finalizado ──
                if (data.status === "quiz_fim") {
                    const resultado = data.dados ? data.dados.resultado : null;
                    if (document.getElementById('quiz-fim-screen').style.display !== 'flex') {
                        showQuizFim(resultado);
                    }
                    return;
                }

                // Status ATIVO
                const sceneData = data.dados || data;
                const textoHistoria = sceneData.historia_original || sceneData.historia || "";
                
                if (data.session_id !== lastSessionId || textoHistoria !== lastHistoryText) {
                    lastSessionId = data.session_id;
                    lastHistoryText = textoHistoria;

                    hideModal();
                    document.getElementById('loader').style.display = 'flex'; // mantem loader até imagem 1 carregar
                    
                    const storyTextEl = document.getElementById('story-text');
                    
                    const hasImages = Array.isArray(sceneData.imagens_arquivos) && sceneData.imagens_arquivos.length > 0;
                    if (hasImages) {
                        // Split text into sentences
                        const sentences = textoHistoria.match(/[^.!?]+[.!?]+/g) || [textoHistoria];
                        const numChunks = sceneData.imagens_arquivos.length;
                        const textChunks = [];
                        const base = Math.floor(sentences.length / numChunks);
                        let remainder = sentences.length % numChunks;
                        let sIdx = 0;
                        for (let i = 0; i < numChunks; i++) {
                            let count = base + (remainder > 0 ? 1 : 0);
                            remainder--;
                            let chunkSentences = [];
                            for(let j = 0; j < count && sIdx < sentences.length; j++) {
                                chunkSentences.push(sentences[sIdx].trim());
                                sIdx++;
                            }
                            textChunks.push(chunkSentences.join(' '));
                        }
                        
                        startImageSequence(sceneData.imagens_arquivos, sceneData, textChunks);
                    } else {
                        typeWriterEffect(textoHistoria, storyTextEl);
                        document.getElementById('loader').style.display = 'none';
                        triggerDecisionModal(sceneData);
                    }
                }
            } catch (err) {
                console.log("Erro ao sincronizar:", err);
            }
        }

        // ─── QUIZ FUNCTIONS ───────────────────────────────────────────────

        let quizRespondidaAtual = false;

        function showQuizModal(sessionId, perguntaId, dadosPergunta, numAtual, total) {
            quizRespondidaAtual = false;

            document.getElementById('quiz-progress').innerText = `Pergunta ${numAtual} de ${total}`;
            document.getElementById('quiz-question').innerText = dadosPergunta.pergunta;

            const optsContainer = document.getElementById('quiz-options');
            optsContainer.innerHTML = '';

            const quizModal = document.getElementById('quiz-modal');
            quizModal.style.display = 'flex';

            gsap.fromTo(quizModal.querySelector('.quiz-box'),
                { scale: 0.92, opacity: 0 },
                { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }
            );

            dadosPergunta.opcoes.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = opt;
                btn.onclick = () => respondirQuiz(sessionId, perguntaId, idx, btn, optsContainer);
                optsContainer.appendChild(btn);
            });
        }

        async function respondirQuiz(sessionId, perguntaId, respostaIdx, btnClicado, optsContainer) {
            if (quizRespondidaAtual) return;
            quizRespondidaAtual = true;

            // Bloqueia todos os botões imediatamente
            optsContainer.querySelectorAll('.quiz-btn').forEach(b => b.disabled = true);

            // Envia resposta ao servidor
            try {
                await fetch(`${API_URL}/responder_quiz`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        pergunta_id: perguntaId,
                        resposta_idx: respostaIdx
                    })
                });
            } catch(e) {
                console.error("Erro ao enviar resposta do quiz:", e);
            }

            // Aguarda 1.5s antes de liberar o polling para detectar a próxima pergunta
            await new Promise(r => setTimeout(r, 1500));
            document.getElementById('quiz-question').innerText = "..."; // reset para o polling detectar mudança
        }

        function showQuizFim(resultado) {
            document.getElementById('quiz-modal').style.display = 'none';
            document.getElementById('loader').style.display = 'none';

            const fimScreen = document.getElementById('quiz-fim-screen');
            fimScreen.style.display = 'flex';
            gsap.fromTo(fimScreen, { opacity: 0 }, { opacity: 1, duration: 1, ease: "power2.out" });

            if (resultado) {
                const acertos = resultado.acertos || 0;
                const total = resultado.total_perguntas || 5;
                const nome = resultado.nome_aluno || "Explorador";
                const pct = resultado.percentual || 0;

                document.getElementById('quiz-fim-badge').innerText = `${acertos} / ${total}`;

                let titulo = "Parabéns!";
                let subtitulo = `${nome}, você completou a jornada histórica!`;

                if (pct === 100) {
                    titulo = "Perfeito! 🌟";
                    subtitulo = `${nome}, acertou tudo! Você é um verdadeiro explorador da história!`;
                } else if (pct >= 66) {
                    titulo = "Muito bem! 👏";
                    subtitulo = `${nome}, você conhece bem a história!`;
                } else if (pct >= 33) {
                    titulo = "Bom trabalho!";
                    subtitulo = `${nome}, continue explorando para aprender mais!`;
                } else {
                    titulo = "Continue tentando!";
                    subtitulo = `${nome}, cada jornada é uma nova oportunidade de aprender!`;
                }

                document.getElementById('quiz-fim-titulo').innerText = titulo;
                document.getElementById('quiz-fim-subtitulo').innerText = subtitulo;
            }

            // Após 4 segundos, transiciona para o questionário Likert
            setTimeout(() => {
                fimScreen.style.display = 'none';
                iniciarLikert();
            }, 4000);
        }

        // ─── QUESTIONÁRIO LIKERT ───────────────────────────────────────────

                    },

        ];

        let likertSecaoAtual = 0;
        const likertRespostas = {};

        function iniciarLikert() {
            likertSecaoAtual = 0;
            document.getElementById('likert-screen').style.display = 'flex';
            gsap.fromTo('#likert-screen', { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" });
            renderizarSecaoLikert();
        }

        function renderizarSecaoLikert() {
            const totalSecoes = LIKERT_SECOES.length;
            const secao = LIKERT_SECOES[likertSecaoAtual];
            const secaoNum = likertSecaoAtual + 1;

            document.getElementById('likert-progress').innerText = `Seção ${secaoNum} de ${totalSecoes}`;
            document.getElementById('likert-section-title').innerText = secao.titulo;
            document.getElementById('likert-section-desc').innerText = secao.desc || '';

            const container = document.getElementById('likert-questions-container');
            container.innerHTML = '';

            if (secao.tipo === 'escala') {
                secao.perguntas.forEach((p, pIdx) => {
                    const chave = `s${likertSecaoAtual}_q${pIdx}`;
                    const block = document.createElement('div');
                    block.className = 'likert-question-block';
                    block.innerHTML = `
                        <div class="likert-question-text">${p.texto}</div>
                        <div class="likert-scale">
                            <span class="likert-label">${p.labelEsq}</span>
                            <div class="likert-buttons" id="btns_${chave}">
                                ${[1,2,3,4,5].map(v => `<button class="likert-btn" onclick="selecionarLikert('${chave}',${v},this)">${v}</button>`).join('')}
                            </div>
                            <span class="likert-label right">${p.labelDir}</span>
                        </div>`;
                    container.appendChild(block);
                });
            } else if (secao.tipo === 'grid') {
                secao.grupos.forEach((grupo, gIdx) => {
                    const header = document.createElement('div');
                    header.style.cssText = 'font-family:"Playfair Display",serif;font-size:1.2rem;color:var(--accent);margin:24px 0 10px;';
                    header.innerText = grupo.subtitulo;
                    container.appendChild(header);

                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'likert-grid';
                    let tableHtml = `<table><thead><tr><th style="text-align:left">Par</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody>`;
                    grupo.linhas.forEach((linha, lIdx) => {
                        const chave = `s${likertSecaoAtual}_g${gIdx}_l${lIdx}`;
                        tableHtml += `<tr><td>${linha}</td>${[1,2,3,4,5].map(v => `<td><button class="grid-btn" id="grid_${chave}_${v}" onclick="selecionarGrid('${chave}',${v})">${v}</button></td>`).join('')}</tr>`;
                    });
                    tableHtml += `</tbody></table>`;
                    gridDiv.innerHTML = tableHtml;
                    container.appendChild(gridDiv);
                });
            }

            atualizarBotaoLikert();
            gsap.fromTo('.likert-box', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" });
        }

        function selecionarLikert(chave, valor, btn) {
            likertRespostas[chave] = valor;
            const container = btn.closest('.likert-buttons');
            container.querySelectorAll('.likert-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            atualizarBotaoLikert();
        }

        function selecionarGrid(chave, valor) {
            likertRespostas[chave] = valor;
            [1,2,3,4,5].forEach(v => {
                const b = document.getElementById(`grid_${chave}_${v}`);
                if (b) b.classList.toggle('selected', v === valor);
            });
            atualizarBotaoLikert();
        }

        function secaoRespondida() {
            const secao = LIKERT_SECOES[likertSecaoAtual];
            if (secao.tipo === 'escala') {
                return secao.perguntas.every((_, pIdx) => likertRespostas[`s${likertSecaoAtual}_q${pIdx}`] !== undefined);
            } else if (secao.tipo === 'grid') {
                return secao.grupos.every((grupo, gIdx) =>
                    grupo.linhas.every((_, lIdx) => likertRespostas[`s${likertSecaoAtual}_g${gIdx}_l${lIdx}`] !== undefined)
                );
            }
            return true;
        }

        function atualizarBotaoLikert() {
            document.getElementById('likert-next-btn').disabled = !secaoRespondida();
        }

        function likertNext() {
            likertSecaoAtual++;
            if (likertSecaoAtual < LIKERT_SECOES.length) {
                renderizarSecaoLikert();
                document.getElementById('likert-screen').scrollTop = 0;
            } else {
                // Todas as seções respondidas → tela final
                document.getElementById('likert-screen').style.display = 'none';
                const fim = document.getElementById('fim-screen');
                fim.style.display = 'flex';
                gsap.fromTo(fim, { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" });
                console.log("📊 Respostas Likert:", JSON.stringify(likertRespostas));
            }
        }

        function pollStatus() {
            setInterval(checkActiveSession, 2000);
        }

    </script>
